<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#212121;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;flex-direction:column;min-height:100dvh}header{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #383838}.brand{font-size:18px;font-weight:700}.brand span{color:#a99aff}.actions{display:flex;gap:7px}button{border:0;border-radius:12px;background:#343434;color:#fff;padding:10px 12px;font-size:14px;cursor:pointer}button:disabled{opacity:.5}#chat{flex:1;overflow:auto;padding:18px 14px 24px;overscroll-behavior:contain}.welcome{text-align:center;margin:18vh auto 0}.welcome h1{font-size:25px}.welcome p,.muted{color:#aaa;font-size:14px}.message{max-width:800px;margin:0 auto 20px;line-height:1.75;overflow-wrap:anywhere}.user{width:fit-content;max-width:90%;margin-left:auto;background:#303030;border-radius:20px;padding:12px 16px;white-space:pre-wrap}.ai{white-space:pre-wrap;padding:8px 2px}.bottom{flex-shrink:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#212121}.composer{max-width:800px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:8px;background:#303030;border:1px solid #444;border-radius:24px}textarea{flex:1;min-width:0;min-height:44px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:white;font:16px inherit;padding:12px 8px}textarea::placeholder{color:#aaa}#send{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:#f5f5f5;color:#222;font-size:22px;padding:0}.note{text-align:center;color:#888;font-size:11px;margin-top:7px}@media(min-width:700px){#chat{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<header><div class="brand">NOVA <span>AI</span></div><div class="actions"><button id="newChat" type="button">＋ 新規</button><button id="clear" type="button">消去</button></div></header>
<main id="chat" aria-live="polite"><section class="welcome" id="welcome"><h1>何をお手伝いしましょうか？</h1><p>NOVA AIへようこそ</p></section></main>
<footer class="bottom"><div class="composer"><textarea id="input" rows="1" maxlength="4000" placeholder="メッセージを入力..."></textarea><button id="send" type="button" aria-label="送信">↑</button></div><div class="note">NOVA AI</div></footer>
<script>
(() => {
 'use strict';
 const chat=document.getElementById('chat');
 const input=document.getElementById('input');
 const send=document.getElementById('send');
 let busy=false;
 function removeWelcome(){const w=document.getElementById('welcome');if(w)w.remove();}
 function addMessage(text,kind){removeWelcome();const outer=document.createElement('div');outer.className='message';const inner=document.createElement('div');inner.className=kind;inner.textContent=String(text);outer.appendChild(inner);chat.appendChild(outer);chat.scrollTop=chat.scrollHeight;return inner;}
 function reset(){if(busy)return;chat.replaceChildren();const section=document.createElement('section');section.className='welcome';section.id='welcome';const h=document.createElement('h1');h.textContent='何をお手伝いしましょうか？';const p=document.createElement('p');p.textContent='NOVA AIへようこそ';section.append(h,p);chat.appendChild(section);input.value='';input.style.height='44px';input.focus();}
 function clear(){if(!busy&&window.confirm('チャットを消去しますか？'))reset();}
 function sendMessage(){if(busy)return;const text=input.value.trim();if(!text)return;addMessage(text,'user');input.value='';input.style.height='44px';addMessage('このページのチャット画面は動作しています。\n\nまだAIサーバーが接続されていないため、AIからの回答は生成できません。GitHub PagesだけではAIサーバーを実行できません。','ai');}
 document.getElementById('newChat').addEventListener('click',reset);
 document.getElementById('clear').addEventListener('click',clear);
 send.addEventListener('click',sendMessage);
 input.addEventListener('input',()=>{input.style.height='44px';input.style.height=Math.min(input.scrollHeight,130)+'px';});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
})();
</script>
</body>
</html>
